<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>GeorgeBot</title>
 <link rel="stylesheet" href="style.css">
 <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

 <div class="chat-container">

  <!-- =================================
       GEORGE BOT HEADER
       ================================= -->

  <header class="chat-header">

   <div class="bot-icon">
    <div class="robot-face">
     <div class="robot-eyes">
      <span></span>
      <span></span>
     </div>
     <div class="robot-mouth"></div>
    </div>
   </div>

   <div>
    <h1>GeorgeBot</h1>
    <p>Your Computing Learning Buddy</p>
    <small>Not an AI chatbot — follows programmed rules.</small>
   </div>

  </header>


  <!-- =================================
       CHAT AREA
       ================================= -->

  <main id="chat">

   <div class="message bot-message">
    <strong>GeorgeBot</strong>
    <p>
     Hello! 👋 I'm GeorgeBot.
     Ask me something about Computing!
    </p>
   </div>

  </main>


  <!-- =================================
       ACTIVITIES MENU
       ================================= -->

  <button id="activities-button" class="activities-button" type="button" aria-label="Open Activities menu" aria-expanded="false">
   🎮
  </button>

  <aside id="activities-menu" class="activities-menu" hidden>

   <div class="activities-menu-header">
    <strong>Activities</strong>
    <button id="close-activities-button" type="button" aria-label="Close Activities menu">×</button>
   </div>

   <button id="tic-tac-toe-button" class="activity-button" type="button">
    Tic-Tac-Toe
   </button>

   <button id="chess-button" class="activity-button" type="button">
    ♟️ Chess
   </button>

   <button class="activity-button activity-coming-soon" type="button" disabled>
    More coming soon...
   </button>

  </aside>


  <!-- =================================
       GAME WINDOW
       ================================= -->

  <div id="game-modal" class="game-modal" hidden>

   <div class="game-modal-content">

    <button id="close-game-button" class="close-game-button" type="button" aria-label="Close game">
     ×
    </button>

    <div id="game-container"></div>

   </div>

  </div>


  <!-- =================================
       QUESTION / INPUT AREA
       ================================= -->

  <form id="chat-form">

   <input
    type="text"
    id="user-input"
    placeholder="Ask GeorgeBot something..."
    autocomplete="off"
   >

   <button type="submit" aria-label="Send message">
    ➤
   </button>

  </form>

 </div>


 <!-- =====================================
      JAVASCRIPT
      ===================================== -->

 <script src="knowledge.js"></script>
 <script src="knowledge/year4/the-internet/knowledge.js"></script>
 <script src="knowledge/year4/the-internet/lesson4.js"></script>
 <script src="script.js"></script>

</body>

</html>
